# Alertmanager routing for X-Aegis.
#
# Secrets are never committed. Mount them at the paths below (see secrets/README.md):
#   /etc/alertmanager/secrets/slack_webhook.url
#   /etc/alertmanager/secrets/pagerduty.routing_key
#
# Warning alerts → Slack only.
# Critical alerts → Slack + PagerDuty Events API v2.

global:
  resolve_timeout: 5m
  pagerduty_url: https://events.pagerduty.com/v2/enqueue

route:
  receiver: slack-default
  group_by: [alertname, severity, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: slack-pagerduty-critical
      continue: false

inhibit_rules:
  - source_matchers:
      - alertname = "KeeperCircuitBreakerActivated"
    target_matchers:
      - alertname = "RebalanceFailed"
    equal: [component]

receivers:
  - name: slack-default
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook.url
        channel: "#aegis-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Component:* {{ .Labels.component }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}

  - name: slack-pagerduty-critical
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook.url
        channel: "#aegis-critical"
        send_resolved: true
        title: '[CRITICAL {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Component:* {{ .Labels.component }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty.routing_key
        send_resolved: true
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'
        client: x-aegis-alertmanager
        client_url: http://alertmanager:9093
        details:
          alertname: '{{ .CommonLabels.alertname }}'
          component: '{{ .CommonLabels.component }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
          description: '{{ .CommonAnnotations.description }}'
        links:
          - href: '{{ .CommonAnnotations.runbook_url }}'
            text: Response runbook
