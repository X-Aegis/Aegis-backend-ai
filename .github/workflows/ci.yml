name: Aegis Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Tests
        run: |
          if find . -maxdepth 3 -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest --tb=short
          else
            echo "No tests found. Skipping pytest."
          fi
